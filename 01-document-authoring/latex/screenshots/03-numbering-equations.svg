ext x="365" y="343" fill="#8059a5" font-family="monospace" font-size="17">\begin{document}</text><text x="365" y="368" fill="#8059a5" font-family="monospace" font-size="17">\section{Numbering}</text><text x="365" y="393" fill="#718b70" font-family="monospace" font-size="17">% Equation of an ellipse</text><text x="365" y="418" fill="#8059a5" font-family="monospace" font-size="17">\begin{equation}</text><text x="365" y="443" fill="#8059a5" font-family="monospace" font-size="17">  \frac{x^2}{a^2}+\frac{y^2}{b^2}=1</text><text x="365" y="468" fill="#8059a5" font-family="monospace" font-size="17">\end{equation}</text><text x="365" y="493" fill="#718b70" font-family="monospace" font-size="17">% Equation of a circle</text><text x="365" y="518" fill="#8059a5" font-family="monospace" font-size="17">\begin{equation}</text><text x="365" y="543" fill="#343b48" font-family="monospace" font-size="17">  x^2+y^2=1</text><text x="365" y="568" fill="#8059a5" font-family="monospace" font-size="17">  \label{eq:circle}</text><text x="365" y="593" fill="#8059a5" font-family="monospace" font-size="17">\end{equation}</text><text x="365" y="618" fill="#343b48" font-family="monospace" font-size="17">Equation~\ref{eq:circle} denotes a circle.</text><text x="365" y="643" fill="#8059a5" font-family="monospace" font-size="17">\end{document}</text><rect y="1012" width="1680" height="38" fill="#e8ebf1"/><text x="18" y="1037" font-family="sans-serif" font-size="15" fill="#4b505a">UTF-8 | LaTeX source | Recreated example based on Assignment 6 — not an original session capture</text></svg>